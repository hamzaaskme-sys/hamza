# Nom du workflow (affiché dans l'onglet "Actions" de GitHub)
name: CI/CD Pipeline

# DÉCLENCHEURS : push ou pull request sur main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1 : Tests
  test:
    # Runner : machine Ubuntu fournie par GitHub
    runs-on: ubuntu-latest
    steps:
      # 1. Clone le dépôt sur le runner (sinon le runner est vide)
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installe Python 3.12 avec le cache pip
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Installe les dépendances
      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # 4. Lance les tests (échec = job rouge)
      - name: Lancer les tests
        run: pytest -q

  # JOB 2 : Build Docker (seulement si "test" réussit)
  build:
    # "needs" : build attend la réussite de test
    needs: test
    runs-on: ubuntu-latest
    steps:
      # 1. Chaque job a son propre runner vierge
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Construit l'image, taguée avec le SHA du commit
      - name: Construire l'image Docker
        run: docker build -t myapp:${{ github.sha }} .

      # 3. Message de confirmation
      - name: Confirmer le build
        run: echo "Image construite avec le tag myapp:${GITHUB_SHA}"
